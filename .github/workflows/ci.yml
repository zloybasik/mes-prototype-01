name: CI for mes-prototype

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        working-directory: src
        run: docker compose config --quiet

      - name: Build and start services with Docker Compose
        working-directory: src
        run: docker compose up --build --wait --wait-timeout 300

      - name: Check FastAPI root endpoint
        run: curl -f --retry 5 --retry-connrefused --max-time 5 http://localhost/

      - name: Check FastAPI readiness through Nginx
        run: curl -f --retry 5 --retry-connrefused --max-time 5 http://localhost/health/ready

      - name: Check FastAPI docs
        run: curl -f --retry 5 --retry-connrefused --max-time 5 http://localhost/docs

      - name: Check RabbitMQ UI
        run: curl -f --retry 5 --retry-connrefused --max-time 5 http://localhost:15672

      - name: Run tests inside FastAPI container
        working-directory: src
        run: docker compose exec -T fastapi python -m pytest -q

      - name: Lint with flake8
        run: |
          python -m pip install flake8
          cd src/fastapi
          python -m flake8 app

      - name: Show container status and logs on failure
        if: failure()
        working-directory: src
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop and remove containers
        if: always()
        working-directory: src
        run: docker compose down
